<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Тест формы заявки — ДомПанель">
  <meta name="theme-color" content="#ee7d1b">
  <title>Hello — тест формы · ДомПанель</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="form-test">
    <div class="form-test__inner">
      <img class="form-test__logo" src="assets/logo.svg" alt="" width="48" height="48">
      <p class="form-test__eyebrow">Form test</p>
      <h1>Hello</h1>
      <p class="form-test__lead">Тестовая страница: только форма заявки (ТЗ из веб-студии).</p>

      <form id="contact-form" class="form-test__form" action="#" method="post">
        <label>
          <span>Имя</span>
          <input type="text" name="name" placeholder="Как к вам обращаться" required autocomplete="name">
        </label>
        <label>
          <span>Телефон</span>
          <input type="tel" name="phone" placeholder="+7 (___) ___-__-__" required autocomplete="tel">
        </label>
        <label>
          <span>Что считаем</span>
          <input type="text" name="project" id="form-project" placeholder="Домокомплект, гараж или проект">
        </label>
        <label>
          <span>Комментарий</span>
          <textarea name="message" rows="3" placeholder="Площадь, участок, комплектация"></textarea>
        </label>
        <button class="form-test__submit" type="submit">Отправить заявку</button>
        <p id="form-status" class="form-test__note">Нажимая кнопку, вы соглашаетесь на обработку персональных данных.</p>
      </form>
    </div>
  </main>
</body>
</html>
